# Corvane Mutual product recipe, "nothing optional": msock-dev standard 2026.11.16 (sd 2.2.0; moved from 2026.10.60 on 2026-11-24) with every stage on (05, 07, 08 kept
# on), stage 07 widened from the D01/D04 allowlist to all 18 dimensions that have a detector, and the completeness
# critic no longer held. mandatory_stages itself belongs to the standard and cannot be changed by a product (R-06).
recipe: corvane-mutual-full
version: 1
extends: msock/standard-recipe 2026.11.16

changes:
  - stage: 04 Deterministic Parse
    set:
      params: { project: corvane-mutual, database: postgres/claims, default_schema: public }
  - stage: 07 Cross Source discovery
    set:
      synthesis_scope.kinds: [D01, D02, D03, D04, D05, D06, D07, D08, D09, D10, D11, D12, D13, D15, D16, D17, D18, D19]
      synthesis_scope.critic: run

lanes: { at_once: 5, per_lane_jobs: 900, priority: [claims] }

# checks.mode is left unset here (rule_only) on purpose, 2026-11-18: msock-dev resolves `checks: { mode: full }` and
# accepts it at run end, but its Checker is wired without a usefulness measure, so a full check always fails
# ("usefulness: not measured") and the harness then never publishes, which would stop every Ask question. ST-C6 is
# run instead in a third sitting with recipe-full-checksfull-msockdev.yaml (see run-plan-full.md).

databaseChangeLog:
  - changeSet:
      id: 010-rating-factor-table
      author: policy-core
      changes:
        - createTable:
            tableName: rating_factor
            remarks: "Mirror of the Java factor maps, read by the underwriting console"
            columns:
              - column: { name: line_code, type: CHAR(3), constraints: { nullable: false } }
              - column: { name: factor, type: VARCHAR(40), constraints: { nullable: false } }
              - column: { name: option_value, type: VARCHAR(40), constraints: { nullable: false } }
              - column: { name: loading, type: DECIMAL(5,2), constraints: { nullable: false } }

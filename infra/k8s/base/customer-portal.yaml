apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-portal
  labels: {app: customer-portal, team: digital}
spec:
  replicas: 3
  selector:
    matchLabels: {app: customer-portal}
  template:
    metadata:
      labels: {app: customer-portal, team: digital}
    spec:
      serviceAccountName: customer-portal
      containers:
      - name: customer-portal
        image: europe-west2-docker.pkg.dev/corvane-platform/apps/customer-portal:${IMAGE_TAG}
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom: {configMapKeyRef: {name: corvane-env, key: profile}}
        resources:
          requests: {cpu: "100m", memory: "128Mi"}
          limits: {memory: "128Mi"}
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: customer-portal
spec:
  selector: {app: customer-portal}
  ports:
  - port: 8080
    targetPort: 8080

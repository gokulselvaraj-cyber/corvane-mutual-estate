apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  labels: {app: notifications, team: digital}
spec:
  replicas: 3
  selector:
    matchLabels: {app: notifications}
  template:
    metadata:
      labels: {app: notifications, team: digital}
    spec:
      serviceAccountName: notifications
      containers:
      - name: notifications
        image: europe-west2-docker.pkg.dev/corvane-platform/apps/notifications:${IMAGE_TAG}
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom: {configMapKeyRef: {name: corvane-env, key: profile}}
        resources:
          requests: {cpu: "250m", memory: "512Mi"}
          limits: {memory: "512Mi"}
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: notifications
spec:
  selector: {app: notifications}
  ports:
  - port: 8080
    targetPort: 8080

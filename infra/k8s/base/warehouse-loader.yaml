apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehouse-loader
  labels: {app: warehouse-loader, team: data-platform}
spec:
  replicas: 3
  selector:
    matchLabels: {app: warehouse-loader}
  template:
    metadata:
      labels: {app: warehouse-loader, team: data-platform}
    spec:
      serviceAccountName: warehouse-loader
      containers:
      - name: warehouse-loader
        image: europe-west2-docker.pkg.dev/corvane-platform/apps/warehouse-loader:${IMAGE_TAG}
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom: {configMapKeyRef: {name: corvane-env, key: profile}}
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: warehouse-loader-db, key: password}}
        resources:
          requests: {cpu: "500m", memory: "1Gi"}
          limits: {memory: "1Gi"}
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: warehouse-loader
spec:
  selector: {app: warehouse-loader}
  ports:
  - port: 8080
    targetPort: 8080

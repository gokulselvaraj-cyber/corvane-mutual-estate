apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-gateway
  labels: {app: payments-gateway, team: payments}
spec:
  replicas: 3
  selector:
    matchLabels: {app: payments-gateway}
  template:
    metadata:
      labels: {app: payments-gateway, team: payments}
    spec:
      serviceAccountName: payments-gateway
      containers:
      - name: payments-gateway
        image: europe-west2-docker.pkg.dev/corvane-platform/apps/payments-gateway:${IMAGE_TAG}
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom: {configMapKeyRef: {name: corvane-env, key: profile}}
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: payments-gateway-db, key: password}}
        resources:
          requests: {cpu: "250m", memory: "256Mi"}
          limits: {memory: "256Mi"}
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: payments-gateway
spec:
  selector: {app: payments-gateway}
  ports:
  - port: 8080
    targetPort: 8080

apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-service
  labels: {app: claims-service, team: claims-platform}
spec:
  replicas: 3
  selector:
    matchLabels: {app: claims-service}
  template:
    metadata:
      labels: {app: claims-service, team: claims-platform}
    spec:
      serviceAccountName: claims-service
      containers:
      - name: claims-service
        image: europe-west2-docker.pkg.dev/corvane-platform/apps/claims-service:${IMAGE_TAG}
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom: {configMapKeyRef: {name: corvane-env, key: profile}}
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: claims-service-db, key: password}}
        - name: POLICY_ADMIN_URL
          value: http://policy-admin:8080
        - name: FRAUD_SCORING_URL
          value: http://fraud-scoring:8080
        resources:
          requests: {cpu: "500m", memory: "1Gi"}
          limits: {memory: "1Gi"}
        readinessProbe:
          httpGet: {path: /actuator/health/readiness, port: 8080}
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /actuator/health/liveness, port: 8080}
          initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: claims-service
spec:
  selector: {app: claims-service}
  ports:
  - port: 8080
    targetPort: 8080

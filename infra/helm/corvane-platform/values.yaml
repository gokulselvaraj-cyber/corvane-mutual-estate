global:
  imageRegistry: europe-west2-docker.pkg.dev/corvane-platform/apps
  imageTag: latest
  region: europe-west2

services:
  policy-admin:
    replicas: 2
    port: 8080
    resources: {cpu: "500m", memory: "1Gi"}
  claims-service:
    replicas: 2
    port: 8080
    resources: {cpu: "500m", memory: "1Gi"}
  fraud-scoring:
    replicas: 2
    port: 8080
    resources: {cpu: "1", memory: "2Gi"}
  payments-gateway:
    replicas: 2
    port: 8080
    resources: {cpu: "250m", memory: "256Mi"}
  notifications:
    replicas: 2
    port: 8080
    resources: {cpu: "250m", memory: "512Mi"}
  broker-commissions:
    replicas: 2
    port: 8080
    resources: {cpu: "250m", memory: "512Mi"}
  warehouse-loader:
    replicas: 2
    port: 8080
    resources: {cpu: "500m", memory: "1Gi"}
  customer-portal:
    replicas: 2
    port: 8080
    resources: {cpu: "100m", memory: "128Mi"}
